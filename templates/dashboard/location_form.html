{% extends 'dashboard/base.html' %}

{% block dashboard_title %}{% if object %}Edit Location{% else %}Add New Location{% endif %}{% endblock %}

{% block dashboard_actions %}
<a href="{% url 'dashboard:location_list' %}" class="btn btn-outline-secondary">
    <i class="fas fa-arrow-left me-1"></i>Back to List
</a>
{% endblock %}

{% block dashboard_content %}
<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        <form method="POST">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label">Location Name *</label>
                    <input type="text" name="name" class="form-control" value="{{ object.name|default:'' }}" required maxlength="200">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Status</label>
                    <select name="is_active" class="form-select">
                        <option value="1" {% if object.is_active %}selected{% endif %}>Active</option>
                        <option value="0" {% if not object.is_active %}selected{% endif %}>Inactive</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">City</label>
                    <input type="text" name="city" class="form-control" value="{{ object.city|default:'' }}" maxlength="100">
                </div>
                <div class="col-md-6">
                    <label class="form-label">State</label>
                    <input type="text" name="state" class="form-control" value="{{ object.state|default:'' }}" maxlength="100">
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i>{% if object %}Update{% else %}Create{% endif %} Location
                </button>
                <a href="{% url 'dashboard:location_list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
