{% extends 'dashboard/base.html' %}

{% block dashboard_title %}Site Settings{% endblock %}

{% block dashboard_content %}
<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        <form method="POST">
            {% csrf_token %}
            
            <!-- General Settings -->
            <h5 class="mb-3 text-primary">General Settings</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">Site Name *</label>
                    <input type="text" name="site_name" class="form-control" value="{{ settings.site_name }}" required maxlength="100">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Tagline</label>
                    <input type="text" name="tagline" class="form-control" value="{{ settings.tagline }}" maxlength="200">
                </div>
                <div class="col-12">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="3">{{ settings.description }}</textarea>
                </div>
            </div>

            <!-- Contact Information -->
            <h5 class="mb-3 text-primary">Contact Information</h5>
            <div class="row g-3 mb-4">
                <div class="col-12">
                    <label class="form-label">Contact Address</label>
                    <textarea name="contact_address" class="form-control" rows="2">{{ settings.contact_address }}</textarea>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Contact Phone</label>
                    <input type="text" name="contact_phone" class="form-control" value="{{ settings.contact_phone }}" maxlength="20">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Contact Email</label>
                    <input type="email" name="contact_email" class="form-control" value="{{ settings.contact_email }}">
                </div>
            </div>

            <!-- Social Media -->
            <h5 class="mb-3 text-primary">Social Media</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">Facebook URL</label>
                    <input type="url" name="facebook_url" class="form-control" value="{{ settings.facebook_url }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Instagram URL</label>
                    <input type="url" name="instagram_url" class="form-control" value="{{ settings.instagram_url }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">YouTube URL</label>
                    <input type="url" name="youtube_url" class="form-control" value="{{ settings.youtube_url }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">WhatsApp Number</label>
                    <input type="text" name="whatsapp_number" class="form-control" value="{{ settings.whatsapp_number }}" maxlength="20">
                </div>
            </div>

            <!-- About Page Content -->
            <h5 class="mb-3 text-primary">About Page Content</h5>
            <div class="row g-3 mb-4">
                <div class="col-12">
                    <label class="form-label">Story Title</label>
                    <input type="text" name="about_story_title" class="form-control" value="{{ settings.about_story_title }}" maxlength="200">
                </div>
                <div class="col-12">
                    <label class="form-label">Story Content</label>
                    <textarea name="about_story_content" class="form-control" rows="4">{{ settings.about_story_content }}</textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">Mission Title</label>
                    <input type="text" name="about_mission_title" class="form-control" value="{{ settings.about_mission_title }}" maxlength="200">
                </div>
                <div class="col-12">
                    <label class="form-label">Mission Content</label>
                    <textarea name="about_mission_content" class="form-control" rows="3">{{ settings.about_mission_content }}</textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">Vision Title</label>
                    <input type="text" name="about_vision_title" class="form-control" value="{{ settings.about_vision_title }}" maxlength="200">
                </div>
                <div class="col-12">
                    <label class="form-label">Vision Content</label>
                    <textarea name="about_vision_content" class="form-control" rows="3">{{ settings.about_vision_content }}</textarea>
                </div>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i>Save Settings
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
