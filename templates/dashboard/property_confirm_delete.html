{% extends 'dashboard/base.html' %}
{% load static %}

{% block dashboard_title %}Delete Property{% endblock %}

{% block dashboard_content %}
<div class="card border-0 shadow-sm">
    <div class="card-body text-center p-5">
        <i class="fas fa-exclamation-triangle fa-4x text-danger mb-3"></i>
        <h3>Are you sure?</h3>
        <p class="text-muted mb-4">You are about to delete the property "{{ object.title }}". This action cannot be undone.</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-lg me-2">
                <i class="fas fa-trash me-1"></i>Yes, Delete
            </button>
            <a href="{% url 'dashboard:property_list' %}" class="btn btn-outline-secondary btn-lg">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
